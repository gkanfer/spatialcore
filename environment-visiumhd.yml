  - anndata
  - scanpy
  - spatialdata
  - spatialdata-io
  - spatialdata-plot
  - squidpy
  - geopandas
  - shapely
  - tifffile
  - matplotlib
  - seaborn
  - pandas
  - numpy
  - scipy
  - scikit-learn
  - ipykernel
  - jupyter
  - pip
  - pip:
      - bin2cell
      - scvi-tools
      - voyagerpy
      - spatialleiden
      - -e ".[visiumhd]"
